name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure UI font exists (download if missing)
        run: |
          mkdir -p assets/fonts
          if [ ! -s assets/fonts/ui.ttf ]; then
            echo "Font missing — downloading Baloo 2..."
            URL="https://github.com/google/fonts/raw/main/ofl/baloo2/Baloo2%5Bwght%5D.ttf"
            if command -v wget >/dev/null 2>&1; then
              wget -q -O assets/fonts/ui.ttf "$URL"
            elif command -v curl >/dev/null 2>&1; then
              curl -sSL "$URL" -o assets/fonts/ui.ttf
            else
              echo "Neither wget nor curl available"; exit 1
            fi
          fi
          SZ=$(stat -c%s assets/fonts/ui.ttf 2>/dev/null || echo 0)
          echo "font size: $SZ bytes"
          # a real TTF here is ~300KB; anything tiny is an error page
          if [ "$SZ" -lt 20000 ]; then
            echo "Downloaded font looks invalid (too small)"; head -c 200 assets/fonts/ui.ttf; exit 1
          fi

      - name: Move export templates into place
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi
          ls -la ~/.local/share/godot/export_templates/ || true

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Point Godot at keystore, Android SDK and Java
        run: |
          mkdir -p ~/.config/godot
          JAVA_DIR="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which java)")")")}"
          SDK_DIR="${ANDROID_HOME:-/usr/lib/android-sdk}"
          echo "Java: $JAVA_DIR"
          echo "SDK:  $SDK_DIR"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$SDK_DIR\""
            echo "export/android/java_sdk_path = \"$JAVA_DIR\""
            echo "export/android/debug_keystore = \"$(pwd)/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.tres

      - name: Import project
        run: godot --headless --import . || true

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/orc-defense.apk
          ls -la build/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: orc-defense-apk
          path: build/orc-defense.apk

      - name: Publish APK to a "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: build/orc-defense.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
